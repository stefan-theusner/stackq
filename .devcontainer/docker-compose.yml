services:
  app:
    image: stackq-app:dev
    #build:
    #  context: ..
    #  dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/stackq:cached
    command: sleep infinity
    # Set here (not in devcontainer.json remoteEnv) so docker exec sees them too
    environment:
      DATABASE_URL: postgresql://stackq:stackq@db:5432/stackq
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    # PostgreSQL 18 with the pgvector extension preinstalled
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: stackq
      POSTGRES_PASSWORD: stackq
      POSTGRES_DB: stackq
    volumes:
      # Postgres 18+ images store data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackq -d stackq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
