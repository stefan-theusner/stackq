[tools]
python = "3.12.15"

[env]
# PostgreSQL runs in the devcontainer (image pgvector/pgvector:pg18), not via mise
POSTGRES_VERSION = "18.6"
_.python.venv = { path = ".venv", create = true }
# get_env keeps the devcontainer values (db / host.docker.internal) and falls back to localhost
DATABASE_URL = "{{ get_env(name='DATABASE_URL', default='postgresql://stackq:stackq@localhost:5432/stackq') }}"
OLLAMA_HOST = "{{ get_env(name='OLLAMA_HOST', default='http://localhost:11434') }}"

[tasks.install]
description = "Install the project and dev dependencies"
run = ["pip install -r requirements-dev.txt", "pip install -e . --no-deps"]

[tasks.test]
description = "Run tests"
run = "pytest"

[tasks.lint]
description = "Lint and format check"
run = ["ruff check .", "ruff format --check ."]
