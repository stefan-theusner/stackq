[project]
name = "stackq"
version = "0.1.0"
description = "Ask questions about the STACKIT docs using local AI models (RAG)"
readme = "README.md"
requires-python = ">=3.15"
# Runtime deps: requirements.txt  |  dev tools: requirements-dev.txt
dynamic = ["dependencies"]

[project.scripts]
stackq = "stackq.cli:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
